<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#091319"/>
  <path d="M40,40 L360,40 L340,220 L40,210 Z" fill="#1e3a2f" stroke="#10b981" stroke-width="2.5" opacity="0.85"/>
  <text x="60" y="80" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">ZONE A: Winter Wheat (120 Acres)</text>
  <text x="60" y="105" fill="#94a3b8" font-family="sans-serif" font-size="12">NDVI: 0.82 | Soil Moisture: 36% | Status: Optimal</text>

  <path d="M400,40 L760,50 L750,220 L380,210 Z" fill="#3b3618" stroke="#f59e0b" stroke-width="2.5" opacity="0.85"/>
  <text x="420" y="80" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">ZONE B: Sweet Corn (110 Acres)</text>
  <text x="420" y="105" fill="#94a3b8" font-family="sans-serif" font-size="12">NDVI: 0.69 | Soil Moisture: 28% | Status: Irrigation Active</text>

  <path d="M40,250 L280,250 L270,460 L40,460 Z" fill="#1e293b" stroke="#8b5cf6" stroke-width="2.5" opacity="0.85"/>
  <text x="60" y="290" fill="#a78bfa" font-family="sans-serif" font-size="15" font-weight="bold">ZONE C: Vineyard (75 Acres)</text>
  <text x="60" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12">Brix: 21.4° | Water Stress: Low</text>

  <path d="M310,250 L520,250 L510,460 L300,460 Z" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="2.5" opacity="0.85"/>
  <text x="330" y="290" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">ZONE D: Smart Greenhouse</text>
  <text x="330" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12">Hydroponic EC: 2.1 mS/cm | Temp: 24°C</text>

  <path d="M550,250 L760,250 L760,460 L540,460 Z" fill="#14532d" stroke="#22c55e" stroke-width="2.5" opacity="0.85"/>
  <text x="570" y="290" fill="#4ade80" font-family="sans-serif" font-size="15" font-weight="bold">ZONE E: Soybeans (95 Acres)</text>
  <text x="570" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12">NDVI: 0.77 | N-Fixation: High</text>

  <path d="M0,235 L800,235" stroke="#475569" stroke-width="6" stroke-dasharray="12 6"/>
  <path d="M370,0 L370,500" stroke="#475569" stroke-width="6" stroke-dasharray="12 6"/>
  <rect width="800" height="500" fill="url(#grid)" pointer-events="none"/>
</svg>